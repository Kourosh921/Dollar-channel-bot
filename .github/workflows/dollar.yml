
name: Dollar Channel Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Send dollar price
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def get_json(url, payload=None):
              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "DollarBot/1.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode("utf-8"))

          token = os.environ["BOT_TOKEN"]
          channel = os.environ["CHANNEL_ID"]

          data = get_json(
              "https://nerkh.jahankhahan.shop/data/live.json"
          )

          price = data["rates"]["dollar"]

          if not isinstance(price, (int, float)) or price <= 0:
              raise ValueError("Invalid dollar price")

          # Current date and time in Iran
          now_iran = datetime.now(ZoneInfo("Asia/Tehran"))
          date = now_iran.strftime("%Y/%m/%d")
          clock = now_iran.strftime("%H:%M")

          message = (
              "💵 قیمت دلار آزاد ایران\n\n"
              f"💰 هر دلار: {price:,.0f} تومان\n"
              f"🕒 تاریخ: {date}\n"
              f"⏰ ساعت ایران: {clock}\n\n"
              "⚠️ قیمت بازار ممکن است تغییر کند.\n\n"
              "@dollariran5"
          )

          payload = json.dumps({
              "chat_id": channel,
              "text": message
          }).encode("utf-8")

          result = get_json(
              f"https://api.telegram.org/bot{token}/sendMessage",
              payload
          )

          if not result.get("ok"):
              raise RuntimeError(str(result))

          print("Message sent successfully at Iran time:", clock)
          PY

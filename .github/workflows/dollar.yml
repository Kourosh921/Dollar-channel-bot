name: Dollar Channel Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Send dollar price
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def get_json(url, payload=None):
              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers={
                      "User-Agent": "DollarChannelBot/1.0",
                      "Content-Type": "application/json"
                  }
              )
              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          token = os.environ["BOT_TOKEN"]
          channel = os.environ["CHANNEL_ID"]

          # Get market data
          api_url = (
              "https://raw.githubusercontent.com/"
              "iran-market/iran-market.github.io/"
              "main/data/popular.json"
          )
          payload = get_json(api_url)

          items = payload.get("data", [])
          dollar = next(
              (
                  item for item in items
                  if item.get("symbol") == "USD_IRR_FREE"
              ),
              None
          )

          if not dollar:
              raise ValueError(
                  "Free-market USD not found in API response"
              )

          price = dollar.get("price")

          if (
              not isinstance(price, (int, float))
              or isinstance(price, bool)
              or price <= 0
          ):
              raise ValueError("Invalid dollar price")

          # Iran time: message publication time,
          # not necessarily the data update time.
          now = datetime.now(ZoneInfo("Asia/Tehran"))
          date = now.strftime("%Y/%m/%d")
          clock = now.strftime("%H:%M")

          message = (
              "💵 قیمت دلار آزاد ایران\n\n"
              f"💰 هر دلار: {price:,.0f} تومان\n"
              f"📅 تاریخ ارسال: {date}\n"
              f"⏰ ساعت ارسال: {clock} به وقت ایران\n\n"
              "ℹ️ زمان ارسال پیام لزوماً زمان به‌روزرسانی قیمت نیست.\n"
              "⚠️ قیمت بازار ممکن است تغییر کند.\n\n"
              "@dollariran5"
          )

          result = get_json(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json.dumps({
                  "chat_id": channel,
                  "text": message
              }).encode("utf-8")
          )

          if not result.get("ok"):
              raise RuntimeError(
                  "Telegram could not send the message"
              )

          print("Message sent successfully:", clock)
          PY

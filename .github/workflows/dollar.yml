name: Nabz Dollar Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      ARZHAAM_API_KEY: ${{ secrets.ARZHAAM_API_KEY }}

    steps:
      - name: Publish market prices
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          TOKEN = os.environ["BOT_TOKEN"]
          CHANNEL = os.environ["CHANNEL_ID"]
          API_KEY = os.environ["ARZHAAM_API_KEY"]

          ASSETS = [
              "usd", "gold_18",
              "coin_emami", "coin_nim", "coin_rob",
              "eur", "aed", "usdt", "btc"
          ]

          def get_json(url, headers, data=None):
              req = urllib.request.Request(
                  url, headers=headers, data=data
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          # دریافت اطلاعات از API
          query = urllib.parse.urlencode({
              "assets": ",".join(ASSETS)
          })

          url = "https://arzhaam.ir/api/rates/latest?" + query

          payload = get_json(
              url,
              {
                  "X-App-Key": API_KEY,
                  "User-Agent": "NabzDollarBot/3.0"
              }
          )

          meta = payload.get("meta", {})
          source = str(meta.get("source", "unknown"))
          cache_age = meta.get("cacheAgeMs")

          print("API SOURCE:", source)
          print("CACHE AGE:", cache_age)

          # فقط وضعیت stale صریحاً رد می‌شود.
          if source.lower() == "stale":
              raise ValueError("API reports stale data")

          if not isinstance(cache_age, (int, float)):
              raise ValueError("Cache age is missing")

          if cache_age < 0 or cache_age > 15 * 60 * 1000:
              raise ValueError("API cache is too old")

          if meta.get("currency") != "toman":
              raise ValueError("Prices are not in toman")

          # مرتب‌سازی قیمت‌ها
          rates = payload.get("rates", [])

          if not isinstance(rates, list):
              raise ValueError("Invalid rates response")

          rate_map = {
              item.get("assetId"): item
              for item in rates
              if isinstance(item, dict)
          }

          missing = [
              asset for asset in ASSETS
              if asset not in rate_map
          ]

          if missing:
              raise ValueError(
                  "Missing assets: " + ", ".join(missing)
              )

          now = datetime.now(timezone.utc)
          tehran = ZoneInfo("Asia/Tehran")
          data_times = {}

          # کنترل قیمت و زمان آخرین به‌روزرسانی
          for asset in ASSETS:
              item = rate_map[asset]
              price = item.get("price")

              if (
                  not isinstance(price, (int, float))
                  or isinstance(price, bool)
                  or price <= 0
              ):
                  raise ValueError("Invalid price: " + asset)

              updated = item.get("updatedAt")

              if not updated:
                  raise ValueError("Missing timestamp: " + asset)

              data_time = datetime.fromisoformat(
                  updated.replace("Z", "+00:00")
              )

              if data_time.tzinfo is None:
                  raise ValueError("Invalid timezone: " + asset)

              age = (now - data_time).total_seconds() / 60

              if age < -5 or age > 90:
                  raise ValueError(
                      f"Old price: {asset}, age={age:.0f} minutes"
                  )

              data_times[asset] = data_time

          # قالب قیمت و درصد تغییر
          def show(asset):
              item = rate_map[asset]
              price = item["price"]
              change = item.get("changePercent24h")

              result = f"{price:,.0f}"

              if isinstance(change, (int, float)) and not isinstance(change, bool):
                  result += f" ({change:+.1f}٪)"

              return result

          # ساخت پیام کوتاه کانال
          lines = [
              "📊 نبض دلار | قیمت ارز و طلا",
              "",
              f"💵 دلار: {show('usd')} | 💶 یورو: {show('eur')}",
              f"🥇 طلای ۱۸: {show('gold_18')}",
              f"🪙 امامی: {show('coin_emami')} | نیم: {show('coin_nim')} | ربع: {show('coin_rob')}",
              f"🇦🇪 درهم: {show('aed')} | ₮ تتر: {show('usdt')}",
              f"₿ بیت‌کوین: {show('btc')}",
              ""
          ]

          iran_now = datetime.now(tehran)
          oldest = min(data_times.values()).astimezone(tehran)

          lines.append(
              "🕒 قدیمی‌ترین داده: " +
              oldest.strftime("%H:%M")
          )

          lines.append(
              "📅 زمان ارسال: " +
              iran_now.strftime("%Y/%m/%d - %H:%M")
          )

          lines.extend([
              "",
              "⚠️ قیمت‌ها ممکن است تغییر کنند.",
              "صرفاً جهت اطلاع‌رسانی؛ نه توصیه خرید یا فروش.",
              "",
              "@dollariran5"
          ])

          message = "\n".join(lines)

          # ارسال پیام به تلگرام
          telegram_url = (
              f"https://api.telegram.org/bot{TOKEN}/sendMessage"
          )

          body = json.dumps({
              "chat_id": CHANNEL,
              "text": message,
              "disable_web_page_preview": True
          }).encode("utf-8")

          result = get_json(
              telegram_url,
              {"Content-Type": "application/json"},
              body
          )

          if not result.get("ok"):
              raise RuntimeError("Telegram send failed")

          print("Message sent successfully!")
          PY

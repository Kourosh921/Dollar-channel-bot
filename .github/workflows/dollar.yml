
name: Nabz Dollar Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: nabz-dollar
  cancel-in-progress: false

jobs:
  send-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests jdatetime

      - name: Get prices and send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python <<'PY'
          import os
          import requests
          import jdatetime

          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          TIMEOUT = 25
          TEHRAN = ZoneInfo("Asia/Tehran")

          NERKHARA_URL = (
              "https://nerkhara.com/api/v1/latest.json"
          )

          def get_json(url):
              response = requests.get(
                  url,
                  headers={"User-Agent": "NabzDollarBot/2.0"},
                  timeout=TIMEOUT
              )
              response.raise_for_status()
              return response.json()

          def fa_digits(value):
              return str(value).translate(
                  str.maketrans(
                      "0123456789",
                      "۰۱۲۳۴۵۶۷۸۹"
                  )
              )

          def fmt(value):
              return fa_digits(
                  f"{float(value):,.0f}".replace(",", "٬")
              )

          def fmt_percent(value):
              return fa_digits(f"{abs(value):.2f}")

          def format_change(value):
              if value is None:
                  return "⚪ نامشخص"

              value = float(value)

              if value > 0:
                  return f"🟢 +{fmt_percent(value)}٪"

              if value < 0:
                  return f"🔴 -{fmt_percent(value)}٪"

              return "⚪ ۰٫۰۰٪"

          def parse_time(value):
              result = datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

              if result.tzinfo is None:
                  result = result.replace(
                      tzinfo=timezone.utc
                  )

              return result.astimezone(TEHRAN)

          def get_market_data():
              payload = get_json(NERKHARA_URL)

              items = payload.get("items")

              if not isinstance(items, list):
                  raise ValueError(
                      "Invalid NerkhAra response"
                  )

              result = {
                  item["id"]: item
                  for item in items
                  if isinstance(item, dict)
                  and item.get("id")
              }

              return result

          def get_item(data, item_id):
              item = data.get(item_id)

              if not item:
                  raise ValueError(
                      f"Missing market item: {item_id}"
                  )

              if item.get("stale") is True:
                  raise ValueError(
                      f"Stale market data: {item_id}"
                  )

              price = item.get("price")

              if price is None or float(price) <= 0:
                  raise ValueError(
                      f"Invalid price: {item_id}"
                  )

              if item.get("unit") != "IRT":
                  raise ValueError(
                      f"Unexpected price unit: {item_id}"
                  )

              updated = item.get("updated_utc")

              if not updated:
                  raise ValueError(
                      f"Missing update time: {item_id}"
                  )

              updated_time = parse_time(updated)

              age = (
                  datetime.now(TEHRAN) - updated_time
              ).total_seconds()

              if age > 45 * 60:
                  raise ValueError(
                      f"Price too old: {item_id}"
                  )

              return {
                  "price": float(price),
                  "change": item.get("change_pct"),
                  "updated": updated_time
              }

          def get_bitcoin():
              urls = [
                  "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT",
                  "https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT"
              ]

              for url in urls:
                  try:
                      data = get_json(url)

                      price = float(data["lastPrice"])
                      change = float(
                          data["priceChangePercent"]
                      )

                      if price > 0:
                          return price, change

                  except Exception as error:
                      print("Bitcoin source error:", error)

              raise RuntimeError(
                  "Bitcoin data unavailable"
              )

          def send_telegram(message):
              token = os.environ["BOT_TOKEN"]
              channel = os.environ["CHANNEL_ID"]

              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={
                      "chat_id": channel,
                      "text": message,
                      "disable_web_page_preview": True
                  },
                  timeout=TIMEOUT
              )

              response.raise_for_status()

              result = response.json()

              if not result.get("ok"):
                  raise RuntimeError(result)

          def main():
              data = get_market_data()

              assets = [
                  ("💵 دلار آزاد", "usd"),
                  ("💶 یورو", "eur"),
                  ("🇦🇪 درهم امارات", "aed"),
                  ("🥇 طلای ۱۸ عیار", "gold-18k"),
                  ("🥇 سکه امامی", "coin-emami"),
                  ("🪙 نیم سکه", "coin-half"),
                  ("🪙 ربع سکه", "coin-quarter"),
                  ("💵 تتر", "usdt")
              ]

              market = []

              for name, item_id in assets:
                  item = get_item(data, item_id)

                  market.append(
                      (name, item)
                  )

              btc_price, btc_change = get_bitcoin()

              now = datetime.now(TEHRAN)

              jalali = jdatetime.datetime.fromgregorian(
                  datetime=now.replace(tzinfo=None)
              )

              oldest_update = min(
                  item["updated"]
                  for _, item in market
              )

              lines = [
                  "📊 نبض دلار | قیمت بازار",
                  "━━━━━━━━━━━━━━━━━━"
              ]

              for name, item in market:
                  lines.append(
                      f"{name}: {fmt(item['price'])} تومان"
                  )

                  lines.append(
                      f"   {format_change(item['change'])}"
                  )

              btc_arrow = (
                  "🟢" if btc_change > 0
                  else "🔴" if btc_change < 0
                  else "⚪"
              )

              btc_sign = "+" if btc_change > 0 else ""

              lines.extend([
                  "",
                  "🪙 بازار ارز دیجیتال",
                  f"₿ بیت‌کوین: {fmt(btc_price)} تتر",
                  (
                      f"   {btc_arrow} "
                      f"{fa_digits(btc_sign + f'{btc_change:.2f}')}٪"
                  ),
                  "",
                  "━━━━━━━━━━━━━━━━━━",
                  f"🕒 آخرین دریافت داده: {oldest_update.strftime('%H:%M:%S')}",
                  f"📅 تاریخ ارسال: {jalali.strftime('%Y/%m/%d')}",
                  f"⏰ زمان ارسال: {now.strftime('%H:%M:%S')} تهران",
                  "",
                  "⚠️ قیمت‌ها ممکن است تغییر کنند.",
                  "صرفاً جهت اطلاع‌رسانی؛ نه توصیه خرید یا فروش.",
                  "",
                  "منبع قیمت: NerkhAra",
                  "https://nerkhara.com",
                  "",
                  "@dollariran5"
              ])

              message = "\n".join(lines)

              send_telegram(message)

              print("MESSAGE SENT SUCCESSFULLY")
              print("Tehran time:", now)

          if __name__ == "__main__":
              main()
          PY

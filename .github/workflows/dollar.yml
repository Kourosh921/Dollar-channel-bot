
name: Nabz Dollar Auto Fallback

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  send-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: pip install requests

      - name: Collect prices and publish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ARZHAAM_API_KEY: ${{ secrets.ARZHAAM_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          import statistics
          from datetime import datetime
          from zoneinfo import ZoneInfo

          sources = []

          def add(name, usd, gold):
              usd, gold = int(float(usd)), int(float(gold))
              if usd > 0 and gold > 0:
                  sources.append({
                      "name": name,
                      "usd": usd,
                      "gold": gold
                  })

          def request_json(url, headers=None):
              r = requests.get(
                  url,
                  headers=headers or {
                      "User-Agent": "Mozilla/5.0"
                  },
                  timeout=20
              )
              r.raise_for_status()
              return r.json()

          # 1. TGJU (rial -> toman)
          try:
              data = request_json(
                  "https://call1.tgju.org/ajax.json"
              )["current"]

              add(
                  "TGJU",
                  float(data["price_dollar_rl"]["p"]) / 10,
                  float(data["geram18"]["p"]) / 10
              )
          except Exception as e:
              print("TGJU unavailable:", e)

          # 2. Iran Market (prices in toman)
          try:
              data = request_json(
                  "https://raw.githubusercontent.com/"
                  "iran-market/iran-market.github.io/main/"
                  "data/popular.json"
              )["data"]

              usd = next(
                  x for x in data
                  if x["symbol"] == "USD_IRR_FREE"
              )
              gold = next(
                  x for x in data
                  if x["symbol"] == "GOLD_18K_IRR"
              )

              if not usd.get("stale") and not gold.get("stale"):
                  add("Iran Market", usd["price"], gold["price"])
          except Exception as e:
              print("Iran Market unavailable:", e)

          # 3. NerkhAra (aggregated prices in toman)
          try:
              data = request_json("https://nerkhara.com/api/rates")
              print("NerkhAra response:", data)
              # Only enable after verifying its public API schema.
          except Exception as e:
              print("NerkhAra API unavailable:", e)

          # 4. Arzhaam (prices in toman)
          key = os.getenv("ARZHAAM_API_KEY")
          if key:
              try:
                  data = request_json(
                      "https://arzhaam.ir/api/rates/latest",
                      {"X-App-Key": key}
                  )

                  if data.get("meta", {}).get("source") != "stale":
                      rates = {
                          x["assetId"]: x["price"]
                          for x in data["rates"]
                      }

                      add(
                          "Arzhaam",
                          rates["usd"],
                          rates["gold_18"]
                      )
              except Exception as e:
                  print("Arzhaam unavailable:", e)

          if not sources:
              raise Exception("All price sources failed.")

          def get_consensus(key):
              values = [s[key] for s in sources]
              center = statistics.median(values)

              accepted = [
                  s for s in sources
                  if abs(s[key] - center) / center <= 0.03
              ]

              if len(accepted) >= 2:
                  return (
                      int(statistics.median(s[key] for s in accepted)),
                      accepted,
                      "تجمیع چندمنبعی"
                  )

              if len(sources) == 1:
                  return (
                      sources[0][key],
                      sources,
                      "تک‌منبعی"
                  )

              raise Exception(
                  "Sources disagree; refusing to publish."
              )

          usd, usd_sources, usd_mode = get_consensus("usd")
          gold, gold_sources, gold_mode = get_consensus("gold")

          def fmt(n):
              return f"{n:,}".translate(
                  str.maketrans("0123456789", "۰۱۲۳۴۵۶۷۸۹")
              )

          now = datetime.now(
              ZoneInfo("Asia/Tehran")
          ).strftime("%Y/%m/%d - %H:%M")

          message = f"""
          📊 <b>نبض دلار | گزارش بازار</b>

          💵 دلار آزاد:
          <b>{fmt(usd)} تومان</b>

          🥇 طلای ۱۸ عیار:
          <b>{fmt(gold)} تومان</b>

          📡 منابع دلار: {len(usd_sources)}
          📡 منابع طلا: {len(gold_sources)}

          🔎 وضعیت: {usd_mode} / {gold_mode}
          🕒 ساعت ایران: {now}

          ⚠️ قیمت‌ها ممکن است تغییر کنند.
          @dollariran5
          """

          result = requests.post(
              f"https://api.telegram.org/bot"
              f"{os.environ['BOT_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["CHANNEL_ID"],
                  "text": message,
                  "parse_mode": "HTML"
              },
              timeout=30
          )

          result.raise_for_status()
          if not result.json().get("ok"):
              raise Exception(result.text)

          print("Published successfully!")
          print("Sources:", [s["name"] for s in sources])
          PY

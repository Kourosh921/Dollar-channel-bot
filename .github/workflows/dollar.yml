name: Nabz Dollar Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      ARZHAAM_API_KEY: ${{ secrets.ARZHAAM_API_KEY }}

    steps:
      - name: Publish market prices
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          TOKEN = os.environ["BOT_TOKEN"]
          CHANNEL = os.environ["CHANNEL_ID"]
          API_KEY = os.environ["ARZHAAM_API_KEY"]

          ASSETS = [
              "usd",
              "gold_18",
              "coin_emami",
              "coin_nim",
              "coin_rob",
              "eur",
              "aed",
              "usdt",
              "btc"
          ]

          LABELS = {
              "usd": "💵 دلار آزاد",
              "gold_18": "🪙 طلای ۱۸ عیار",
              "coin_emami": "🟡 سکه امامی",
              "coin_nim": "🟡 نیم سکه",
              "coin_rob": "🟡 ربع سکه",
              "eur": "💶 یورو",
              "aed": "🇦🇪 درهم امارات",
              "usdt": "₮ تتر",
              "btc": "₿ بیت‌کوین"
          }

          def get_json(url, headers=None):
              req = urllib.request.Request(
                  url,
                  headers=headers or {
                      "User-Agent": "NabzDollarBot/1.0"
                  }
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # دریافت قیمت‌ها
          query = urllib.parse.urlencode({
              "assets": ",".join(ASSETS)
          })

          url = (
              "https://arzhaam.ir/api/rates/latest?"
              + query
          )

          payload = get_json(
              url,
              {
                  "X-App-Key": API_KEY,
                  "User-Agent": "NabzDollarBot/1.0"
              }
          )

          meta = payload.get("meta", {})

          # جلوگیری از انتشار داده کش‌شده قدیمی
          if meta.get("source") != "live":
              raise ValueError("API is not live")

          cache_age = meta.get("cacheAgeMs")

          if isinstance(cache_age, (int, float)):
              if cache_age > 15 * 60 * 1000:
                  raise ValueError("API cache is too old")

          rates = {
              item.get("assetId"): item
              for item in payload.get("rates", [])
          }

          now_utc = datetime.now(timezone.utc)
          tehran = ZoneInfo("Asia/Tehran")

          lines = [
              "📊 نبض بازار | قیمت ارز و طلا",
              ""
          ]

          # بررسی تک‌تک قیمت‌ها
          for asset in ASSETS:

              item = rates.get(asset)

              if not item:
                  raise ValueError(
                      f"Missing price: {asset}"
                  )

              price = item.get("price")

              if (
                  not isinstance(price, (int, float))
                  or isinstance(price, bool)
                  or price <= 0
              ):
                  raise ValueError(
                      f"Invalid price: {asset}"
                  )

              updated = item.get("updatedAt")

              if not updated:
                  raise ValueError(
                      f"Missing timestamp: {asset}"
                  )

              data_time = datetime.fromisoformat(
                  updated.replace("Z", "+00:00")
              )

              age = (
                  now_utc - data_time
              ).total_seconds() / 60

              if age < -5 or age > 45:
                  raise ValueError(
                      f"Old price: {asset}"
                  )

              change = item.get("changePercent24h")

              if isinstance(change, (int, float)):
                  change_text = f"{change:+.2f}%"
              else:
                  change_text = "نامشخص"

              direction = item.get("direction")

              if direction == "up":
                  arrow = "🔺"
              elif direction == "down":
                  arrow = "🔻"
              else:
                  arrow = "➖"

              local_time = data_time.astimezone(tehran)
              time_text = local_time.strftime("%H:%M")

              lines.append(
                  f"{LABELS[asset]}: "
                  f"{price:,.0f} تومان"
              )

              lines.append(
                  f"   {arrow} تغییر ۲۴ ساعته: "
                  f"{change_text}"
              )

              lines.append(
                  f"   🕒 زمان داده: {time_text}"
              )

              lines.append("")

          iran_now = datetime.now(tehran)

          lines.extend([
              "⚠️ قیمت‌ها ممکن است تغییر کنند.",
              "این اطلاعات صرفاً جهت اطلاع‌رسانی است؛ "
              "توصیه خرید یا فروش نیست.",
              "",
              "📅 زمان ارسال: "
              + iran_now.strftime("%Y/%m/%d - %H:%M"),
              "",
              "@dollariran5"
          ])

          message = "\n".join(lines)

          # ارسال به کانال تلگرام
          telegram_url = (
              f"https://api.telegram.org/bot{TOKEN}/sendMessage"
          )

          result = get_json(
              telegram_url,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "NabzDollarBot/1.0"
              }
          ) if False else None

          body = json.dumps({
              "chat_id": CHANNEL,
              "text": message
          }).encode("utf-8")

          req = urllib.request.Request(
              telegram_url,
              data=body,
              headers={
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(
              req, timeout=30
          ) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          if not result.get("ok"):
              raise RuntimeError(
                  "Telegram message failed"
              )

          print("Market prices published successfully!")
          PY

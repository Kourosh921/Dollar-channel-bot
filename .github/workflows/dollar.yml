name: Nabz Dollar Bot

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedule: every 5 minutes (GitHub minimum interval).
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: nabz-dollar
  cancel-in-progress: false

jobs:
  send-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start TGJU service
        run: |
          docker pull ghcr.io/amiranmanesh/tgju-api-go:latest
          docker run -d --name tgju-api -p 8080:8080 \
            ghcr.io/amiranmanesh/tgju-api-go:latest

      - name: Wait for TGJU
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/healthz; then
              echo "TGJU is ready"
              exit 0
            fi
            sleep 2
          done
          echo "TGJU service unavailable"
          docker logs tgju-api || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests jdatetime

      - name: Get prices and send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: "@dollariran5"
        run: python bot.py

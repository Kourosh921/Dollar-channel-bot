 
name: Nabz Dollar Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  send-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start TGJU price reader
        run: |
          docker pull ghcr.io/amiranmanesh/tgju-api-go:latest
          docker run -d --name tgju-api -p 8080:8080 \
            ghcr.io/amiranmanesh/tgju-api-go:latest

      - name: Wait for price service
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "TGJU service did not start"
          exit 1

      - name: Install Python packages
        run: |
          python -m pip install requests

      - name: Send prices to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python <<'PY'
          import os
          import requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TGJU = "http://localhost:8080"
          TIMEOUT = 20

          def get_json(url):
              r = requests.get(url, timeout=TIMEOUT)
              r.raise_for_status()
              return r.json()

          def get_tgju_items(market, keys):
              url = f"{TGJU}/v1/markets/{market}/items"
              data = get_json(url + "?keys=" + ",".join(keys))
              items = data.get("items", [])
              return {item.get("key"): item for item in items}

          def toman(item):
              value = item.get("price", {}).get("value")
              if value is None:
                  raise ValueError("Price missing")
              value = float(value) / 10
              if value <= 0:
                  raise ValueError("Invalid price")
              return value

          def change_text(item):
              change = item.get("change", {})
              percent = change.get("percent")
              status = change.get("status")

              if percent is None or status not in ("low", "high"):
                  return "درصد تغییر: نامشخص"

              sign = "+" if status == "high" else "-"
              arrow = "▲" if status == "high" else "▼"
              return f"{arrow} {sign}{abs(float(percent)):.2f}٪"

          def fmt(value):
              return f"{value:,.0f}"

          def get_btc():
              urls = [
                  "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT",
                  "https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT"
              ]

              last_error = None
              for url in urls:
                  try:
                      data = get_json(url)
                      price = float(data["lastPrice"])
                      change = float(data["priceChangePercent"])
                      if price > 0:
                          return price, change
                  except Exception as e:
                      last_error = e

              raise RuntimeError(f"Bitcoin sources failed: {last_error}")

          def send_telegram(message):
              token = os.environ["BOT_TOKEN"]
              channel = os.environ["CHANNEL_ID"]

              url = f"https://api.telegram.org/bot{token}/sendMessage"
              response = requests.post(
                  url,
                  data={
                      "chat_id": channel,
                      "text": message,
                      "disable_web_page_preview": True
                  },
                  timeout=TIMEOUT
              )
              response.raise_for_status()

              result = response.json()
              if not result.get("ok"):
                  raise RuntimeError(result)

          def main():
              currency = get_tgju_items(
                  "currency",
                  ["price_dollar_rl", "price_eur", "price_aed"]
              )

              gold = get_tgju_items(
                  "gold",
                  ["geram18"]
              )

              coin = get_tgju_items(
                  "coin",
                  ["sekee", "nim", "rob"]
              )

              assets = [
                  ("دلار آزاد", currency["price_dollar_rl"]),
                  ("یورو", currency["price_eur"]),
                  ("درهم امارات", currency["price_aed"]),
                  ("طلای ۱۸ عیار", gold["geram18"]),
                  ("سکه امامی", coin["sekee"]),
                  ("نیم‌سکه", coin["nim"]),
                  ("ربع‌سکه", coin["rob"]),
              ]

              now = datetime.now(ZoneInfo("Asia/Tehran"))
              date_text = now.strftime("%Y/%m/%d")
              time_text = now.strftime("%H:%M:%S")

              lines = [
                  "📊 نبض دلار | قیمت بازار",
                  "━━━━━━━━━━━━━━━━━━"
              ]

              for name, item in assets:
                  price = toman(item)
                  change = change_text(item)
                  lines.append(
                      f"💰 {name}: {fmt(price)} تومان\n"
                      f"   {change}"
                  )

              btc_price, btc_change = get_btc()
              btc_sign = "+" if btc_change >= 0 else ""
              btc_arrow = "▲" if btc_change >= 0 else "▼"

              lines.extend([
                  "",
                  "🪙 بازار ارز دیجیتال",
                  f"₿ بیت‌کوین: {fmt(btc_price)} تتر",
                  f"   {btc_arrow} {btc_sign}{btc_change:.2f}٪"
              ])

              lines.extend([
                  "",
                  "━━━━━━━━━━━━━━━━━━",
                  f"🗓 تاریخ: {date_text}",
                  f"🕒 ساعت تهران: {time_text}",
                  "",
                  "⚠️ قیمت‌ها ممکن است تغییر کنند.",
                  "صرفاً جهت اطلاع‌رسانی؛ نه توصیه خرید یا فروش.",
                  "",
                  "@dollariran5"
              ])

              message = "\n".join(lines)
              send_telegram(message)
              print("MESSAGE SENT SUCCESSFULLY")

          if __name__ == "__main__":
              main()
          PY
